services:
  - type: web
    name: cafe-manager-backend
    env: python
    region: singapore # Change to your preferred Render region (e.g. oregon, frankfurt, singapore)
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-manager-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://cafe-managment-ruddy.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://cafe-managment-ruddy.vercel.app

databases:
  - name: cafe-manager-db
    databaseName: cafe_manager_db
    user: cafe_user
    plan: free
